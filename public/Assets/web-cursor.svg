<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Radial Strands -->
    <line x1="3" y1="3" x2="33" y2="3" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="3" y1="3" x2="32" y2="13" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="3" y1="3" x2="28" y2="22" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="3" y1="3" x2="22" y2="28" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="3" y1="3" x2="13" y2="32" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="3" y1="3" x2="3" y2="33" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Concentric Web Arcs / Spirals -->
    <!-- Outer Arc -->
    <path d="M33,3 Q26,11 32,13 Q22,20 28,22 Q20,22 22,28 Q11,26 13,32 Q7,23 3,33" fill="none" stroke="#a31515" stroke-width="1.6" stroke-linecap="round"/>
    
    <!-- Middle Arc -->
    <path d="M23,3 Q18,8 22,10 Q15,14 19,15 Q14,15 15,19 Q8,18 10,22 Q5,16 3,23" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
    
    <!-- Inner Arc -->
    <path d="M13,3 Q10,6 12,7 Q8,9 11,10 Q9,9 10,11 Q5,10 7,12 Q3,9 3,13" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Origin Spider Node -->
    <circle cx="3" cy="3" r="3" fill="#a31515" stroke="#ffffff" stroke-width="1.2"/>
  </g>
</svg>