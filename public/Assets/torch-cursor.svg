<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <defs>
    <radialGradient id="beamGlow" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="torchBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Torch Light Beam radiating from top-left (3, 3) -->
    <polygon points="4,4 32,10 24,30 4,4" fill="url(#beamGlow)"/>
    
    <!-- Light Beam Edge Flares -->
    <line x1="4" y1="4" x2="34" y2="11" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
    <line x1="4" y1="4" x2="25" y2="32" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>

    <!-- Torch Head & Body Angled -->
    <g transform="rotate(45 6 6)">
      <!-- Flashlight Lens / Bulb -->
      <polygon points="4,2 8,2 9,5 3,5" fill="#fef08a" stroke="#f59e0b" stroke-width="0.8"/>
      
      <!-- Flashlight Bezel Head -->
      <rect x="3" y="5" width="6" height="4" rx="1" fill="#334155" stroke="#94a3b8" stroke-width="0.8"/>
      
      <!-- Switch Ring -->
      <rect x="3.5" y="9" width="5" height="2" fill="#ea580c"/>
      
      <!-- Flashlight Body Tube -->
      <rect x="4" y="11" width="4" height="9" rx="1" fill="url(#torchBody)" stroke="#64748b" stroke-width="0.8"/>
      
      <!-- Grip Ridges -->
      <line x1="4" y1="13" x2="8" y2="13" stroke="#94a3b8" stroke-width="0.6"/>
      <line x1="4" y1="15" x2="8" y2="15" stroke="#94a3b8" stroke-width="0.6"/>
      <line x1="4" y1="17" x2="8" y2="17" stroke="#94a3b8" stroke-width="0.6"/>
      
      <!-- Tail Cap -->
      <rect x="3.5" y="20" width="5" height="2" rx="0.5" fill="#1e293b" stroke="#64748b" stroke-width="0.8"/>
    </g>

    <!-- Precise Pointer Tip Spot -->
    <circle cx="4" cy="4" r="3" fill="#fbbf24" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="4" cy="4" r="1" fill="#ffffff"/>
  </g>
</svg>