<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
  <defs>
    <radialGradient id="beamGlowPointer" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="torchBodyPointer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="dropShadowPointer" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#fbbf24" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <g filter="url(#dropShadowPointer)">
    <!-- Torch Light Beam expanding -->
    <polygon points="4,4 38,12 28,36 4,4" fill="url(#beamGlowPointer)"/>
    
    <!-- Light Beam Flares -->
    <line x1="4" y1="4" x2="39" y2="13" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="4" y1="4" x2="29" y2="38" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="4" y1="4" x2="36" y2="26" stroke="#fef08a" stroke-width="1.2" stroke-dasharray="2 3" stroke-linecap="round"/>

    <!-- Torch Head & Body Angled -->
    <g transform="rotate(45 6 6)">
      <polygon points="4,2 8,2 9,5 3,5" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
      <rect x="3" y="5" width="6" height="4" rx="1" fill="#475569" stroke="#fde047" stroke-width="1"/>
      <rect x="3.5" y="9" width="5" height="2" fill="#ef4444"/>
      <rect x="4" y="11" width="4" height="9" rx="1" fill="url(#torchBodyPointer)" stroke="#94a3b8" stroke-width="0.9"/>
      
      <line x1="4" y1="13" x2="8" y2="13" stroke="#fbbf24" stroke-width="0.8"/>
      <line x1="4" y1="15" x2="8" y2="15" stroke="#fbbf24" stroke-width="0.8"/>
      <line x1="4" y1="17" x2="8" y2="17" stroke="#fbbf24" stroke-width="0.8"/>
      
      <rect x="3.5" y="20" width="5" height="2" rx="0.5" fill="#1e293b" stroke="#94a3b8" stroke-width="0.8"/>
    </g>

    <!-- Glowing Target Dot -->
    <circle cx="4" cy="4" r="4" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="4" cy="4" r="1.8" fill="#ffffff"/>
  </g>
</svg>